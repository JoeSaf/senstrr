<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senstr Player</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<style>
body{margin:0;background:black;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:sans-serif;}
.player-container{position:relative;width:100%;height:80%;display:flex;justify-content:center;align-items:center;}
video{width:100%;height:100%;object-fit:contain;background:black;}
.title{position:absolute;top:10px;left:20px;color:white;font-size:15px;background:rgba(0,0,0,0.6);padding:6px 14px;border-radius:20px;z-index:10;}
.home-btn{position:absolute;top:10px;right:20px;background:rgba(0,0,0,0.6);color:white;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;text-decoration:none;font-size:18px;backdrop-filter:blur(10px);transition:.2s;z-index:10;}
.home-btn:hover{background:#0071e3;transform:scale(1.1);}
.controls-row{display:flex;align-items:center;gap:10px;margin-top:10px;width:90%;max-width:800px;}
.sub-select{flex:1;padding:8px 12px;font-size:14px;border-radius:6px;border:none;background:#222;color:white;cursor:pointer;}
.sub-select:hover{background:#333;}
.sub-loading{color:#ffaa00;font-size:14px;display:none;}
</style>
</head>
<body>
    
<div class="player" id="playerBox">
    <div class="title">{{ video_path.split('/')[-1] }}</div>
    <div class="player-container">
        <video id="player" autoplay controls crossorigin>
            <source src="/stream/{{ video_path }}" type="video/mp4">
        </video>
        <a href="/" class="home-btn">🏠</a>
    </div>

    <!-- Subtitle controls row -->
    <div class="controls-row">
        <select id="subtitleSelector" class="sub-select">
            <option value="">No subtitles</option>
            {% for sub in subtitles %}
            <option value="{{ sub.src }}" data-ext="{{ sub.ext }}">{{ sub.label }}</option>
            {% endfor %}
        </select>
        <span id="subLoading" class="sub-loading">⏳ Loading...</span>
    </div>
</div>

<script>
const player = new Plyr('#player', {
    keyboard: { focused: true, global: true },
});

// Resume playback
player.currentTime = {{ resume_time }}

// Save progress every 5s
setInterval(()=>{
    fetch("/save_progress",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({video:"{{ video_path }}", time:player.currentTime})
    })
},5000)

// Next episode functionality
{% if next_ep %}
player.on('ended', () => {
    window.location = "/watch/{{ next_ep }}";
});
{% endif %}

// Manual subtitle loading
const subSelector = document.getElementById('subtitleSelector');
const subLoading = document.getElementById('subLoading');

async function loadSubtitle(subPath, extension) {
    subLoading.style.display = 'inline';

    try {
        let subtitleUrl;

        if (extension === 'srt') {
            subtitleUrl = `/subs/convert/${encodeURIComponent(subPath)}`;
        } else {
            subtitleUrl = `/subs/${encodeURIComponent(subPath)}`;
        }

        // Remove existing tracks
        const tracks = player.media.querySelectorAll('track');
        tracks.forEach(t => t.remove());

        // Create new track
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = subSelector.options[subSelector.selectedIndex].text;
        track.srclang = 'en';
        track.src = subtitleUrl;
        track.default = true;

        player.media.appendChild(track);

        // 🔥 KEY FIX: force reload properly
        player.media.load();

    } catch (error) {
        console.error('Error loading subtitle:', error);
        alert('Failed to load subtitle');
    } finally {
        subLoading.style.display = 'none';
    }
}
subSelector.addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex];
    const subPath = this.value;
    
    if (!subPath) {
        // No subtitle selected - remove all tracks
        const tracks = player.media.querySelectorAll('track');
        tracks.forEach(t => t.remove());
        player.captions.toggle(false);
        return;
    }
    
    const extension = selectedOption.dataset.ext;
    loadSubtitle(subPath, extension);
});

// Optional: Pre-load the first subtitle if any exist and user wants it
{% if subtitles %}
// Uncomment the next line if you want to auto-load the first subtitle
setTimeout(() => { subSelector.value = subSelector.options[1].value; subSelector.dispatchEvent(new Event('change')); }, 1000);
{% endif %}
</script>

</body>
</html>
