<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senstr Player</title>

<style>

body{
margin:0;
background:black;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:sans-serif;
}

.player{
position:relative;
width:100vw;
height:100vh;
background:black;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

/* Floating controls */

.controls{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:22px;

background:rgba(30,30,30,0.8);
backdrop-filter:blur(20px);

padding:14px 30px;
border-radius:40px;

opacity:0;
transition:opacity .3s;
}

.player:hover .controls{
opacity:1;
}

/* Buttons */

.controls button{
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
width:44px;
height:44px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
transition:.2s;
}

.controls button:hover{
background:rgba(255,255,255,0.15);
}

/* play button bigger */

.play{
font-size:30px;
}

/* volume slider */

.volume{
display:flex;
align-items:center;
gap:10px;
}

.volume input{
width:90px;
}

/* timeline */

.timeline{
position:absolute;
bottom:110px;
left:5%;
width:90%;
height:6px;
background:rgba(255,255,255,0.25);
border-radius:4px;
overflow:hidden;
cursor:pointer;
}

.progress{
height:100%;
width:0%;
background:#0071e3;
}

/* title */

.title{
position:absolute;
top:20px;
left:20px;
color:white;
font-size:15px;
background:rgba(0,0,0,0.6);
padding:6px 14px;
border-radius:20px;
}

.home-btn{
position:absolute;
top:20px;
right:20px;

background:rgba(0,0,0,0.6);
color:white;

width:36px;
height:36px;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;
text-decoration:none;
font-size:18px;

backdrop-filter:blur(10px);

transition:.2s;
}

.home-btn:hover{
background:#0071e3;
transform:scale(1.1);
}

</style>
</head>

<body>

<div class="player" id="playerBox">

<div class="title">
{{ video_path.split('/')[-1] }}
</div>
<a href="/" class="home-btn">🏠</a>

<video id="player" autoplay>
<source src="/stream/{{ video_path }}">
</video>

<div class="timeline" id="timeline">
<div class="progress" id="progress"></div>
</div>

<div class="controls" id="controls">

<button onclick="prevEpisode()">⏮</button>

<button onclick="rewind()">⏪</button>

<button onclick="togglePlay()" class="play">⏯</button>

<button onclick="forward()">⏩</button>

{% if next_ep %}
<button onclick="nextEpisode()">⏭</button>
{% endif %}

<div class="volume">

<button onclick="toggleMute()">🔊</button>

<input type="range" min="0" max="1" step="0.05" value="1" id="volume">

</div>

</div>

</div>

<script>

let player = document.getElementById("player")
let progress = document.getElementById("progress")
let timeline = document.getElementById("timeline")
let volume = document.getElementById("volume")

player.currentTime = {{ resume_time }}

/* play pause */

function togglePlay(){
if(player.paused) player.play()
else player.pause()
}

/* skip */

function rewind(){
player.currentTime -= 10
}

function forward(){
player.currentTime += 10
}

/* volume */

volume.oninput = function(){
player.volume = this.value
}

function toggleMute(){
player.muted = !player.muted
}

/* timeline */

player.addEventListener("timeupdate",()=>{

let percent = (player.currentTime / player.duration)*100
progress.style.width = percent+"%"

})

timeline.onclick = function(e){

let rect = this.getBoundingClientRect()
let percent = (e.clientX-rect.left)/rect.width

player.currentTime = percent*player.duration

}

/* keyboard */

document.addEventListener("keydown",(e)=>{

if(e.code=="Space"){
e.preventDefault()
togglePlay()
}

if(e.key=="ArrowRight") forward()
if(e.key=="ArrowLeft") rewind()

if(e.key=="f") player.requestFullscreen()

})

/* save progress */

setInterval(()=>{

fetch("/save_progress",{

method:"POST",
headers:{"Content-Type":"application/json"},

body:JSON.stringify({
video:"{{ video_path }}",
time:player.currentTime
})

})

},5000)

/* next episode */

{% if next_ep %}
function nextEpisode(){
window.location="/watch/{{ next_ep }}"
}

player.onended=function(){
nextEpisode()
}
{% endif %}

</script>

</body>
</html>
